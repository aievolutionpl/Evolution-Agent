name: 🐛 Bug report
description: Something is broken in Hermes by AI Evolution Labs
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please fill in as much as you can — it helps us reproduce and fix faster.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What were you trying to do, and what went wrong?
      placeholder: I clicked the "Client brief" shortcut and Hermes…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /chat
        2. Click "Business report"
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: package.json `version`, or git SHA
      placeholder: 3.0.0
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: How are you running Hermes?
      options:
        - Local dev (pnpm dev)
        - Docker Compose
        - Installed PWA
        - Electron desktop build
        - Tailscale / remote
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console / network logs
      description: Paste any relevant error output. Redact secrets.
      render: shell
