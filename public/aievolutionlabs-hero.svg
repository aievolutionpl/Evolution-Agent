<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Evolution Labs — Your business. Automated.">
  <defs>
    <linearGradient id="hbg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#02110F"/>
      <stop offset="55%" stop-color="#03261F"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="hspot" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#7DFF8A" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hcyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8FFFF"/>
      <stop offset="55%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0085A8"/>
    </linearGradient>
    <pattern id="hpcb" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 0 40 L 28 40 L 36 32 L 44 32 L 52 40 L 80 40" stroke="#0EAA63" stroke-width="0.6" fill="none" opacity="0.45"/>
      <path d="M 40 0 L 40 28 L 32 36 L 32 44 L 40 52 L 40 80" stroke="#0EAA63" stroke-width="0.6" fill="none" opacity="0.45"/>
      <circle cx="40" cy="40" r="1.6" fill="#7DFF8A" opacity="0.55"/>
    </pattern>
    <filter id="hglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#hbg)"/>
  <rect width="1200" height="600" fill="url(#hpcb)" opacity="0.5"/>
  <rect width="1200" height="600" fill="url(#hspot)"/>

  <!-- left dashboard mock -->
  <g transform="translate(60, 180)" opacity="0.9">
    <rect x="0" y="0" width="240" height="190" rx="14" fill="#03191A" stroke="url(#hcyan)" stroke-width="1.4"/>
    <rect x="14" y="14" width="80" height="6" rx="3" fill="#00E5FF"/>
    <rect x="14" y="28" width="120" height="4" rx="2" fill="#2A6E76"/>
    <circle cx="58" cy="108" r="34" fill="none" stroke="#00E5FF" stroke-width="6" stroke-dasharray="120 80"/>
    <text x="58" y="113" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#7DF9FF" text-anchor="middle">87%</text>
    <rect x="120" y="78" width="100" height="22" rx="5" fill="#02211E" stroke="#00E5FF" stroke-width="0.8"/>
    <rect x="120" y="110" width="100" height="22" rx="5" fill="#02211E" stroke="#00E5FF" stroke-width="0.8" opacity="0.6"/>
    <rect x="120" y="142" width="68" height="22" rx="5" fill="#00E5FF"/>
  </g>

  <!-- right tagline panel -->
  <g transform="translate(720, 110)" opacity="0.96">
    <rect x="0" y="0" width="420" height="130" rx="14" fill="#02110F" stroke="url(#hcyan)" stroke-width="1.6"/>
    <text x="24" y="54" font-family="Inter, sans-serif" font-size="34" font-weight="700" fill="#E8FFFB">Your business.</text>
    <text x="24" y="100" font-family="Inter, sans-serif" font-size="34" font-weight="700" fill="#00E5FF">Automated.</text>
  </g>

  <!-- right code mock -->
  <g transform="translate(780, 290)" opacity="0.85">
    <rect x="0" y="0" width="340" height="180" rx="12" fill="#020A09" stroke="url(#hcyan)" stroke-width="1"/>
    <g font-family="JetBrains Mono, monospace" font-size="11" fill="#7DF9FF">
      <text x="14" y="26">hermes.run({</text>
      <text x="28" y="44">brief: "Q3 sales recap",</text>
      <text x="28" y="62">format: "executive",</text>
      <text x="28" y="80">audience: "board"</text>
      <text x="14" y="98">})</text>
      <text x="14" y="124" fill="#00E5FF">→ generated 4 deliverables</text>
      <text x="14" y="142" fill="#00E5FF">→ saved to /reports/q3-2026</text>
      <text x="14" y="160" fill="#7DFF8A">→ ready for review ✓</text>
    </g>
  </g>

  <!-- centerpiece robot silhouette -->
  <g transform="translate(600, 330)" filter="url(#hglow)">
    <ellipse cx="0" cy="-110" rx="52" ry="60" fill="#020A08" stroke="url(#hcyan)" stroke-width="2.2"/>
    <ellipse cx="0" cy="-115" rx="32" ry="14" fill="#00E5FF" opacity="0.85"/>
    <rect x="-12" y="-58" width="24" height="22" rx="6" fill="#02110F" stroke="url(#hcyan)" stroke-width="1.4"/>
    <path d="M -82 -36 Q -94 32, -74 116 Q -52 146, 0 152 Q 52 146, 74 116 Q 94 32, 82 -36 Q 52 -50, 0 -50 Q -52 -50, -82 -36 Z"
          fill="#020A08" stroke="url(#hcyan)" stroke-width="2.2"/>
    <rect x="-28" y="-10" width="56" height="64" rx="11" fill="#021A18" stroke="#00E5FF" stroke-width="1.2"/>
    <circle cx="0" cy="22" r="8" fill="#00E5FF"/>
    <circle cx="0" cy="22" r="14" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.5"/>
    <rect x="-104" y="-30" width="22" height="126" rx="11" fill="#020A08" stroke="url(#hcyan)" stroke-width="1.6"/>
    <rect x="82" y="-30" width="22" height="126" rx="11" fill="#020A08" stroke="url(#hcyan)" stroke-width="1.6"/>
  </g>

  <!-- bottom label -->
  <g transform="translate(600, 560)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#00E5FF" text-anchor="middle">AI EVOLUTION LABS · HERMES</text>
  </g>
</svg>
