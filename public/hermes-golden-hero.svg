<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hermes — Your business. Automated.">
  <defs>
    <linearGradient id="hgh-bg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0A0703"/>
      <stop offset="55%" stop-color="#1A0E03"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="hgh-spot" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#FFD75B" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#C8902A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hgh-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA0"/>
      <stop offset="55%" stop-color="#F5C24A"/>
      <stop offset="100%" stop-color="#7A5410"/>
    </linearGradient>
    <pattern id="hgh-circuit" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 0 40 L 28 40 L 36 32 L 44 32 L 52 40 L 80 40" stroke="#7A5410" stroke-width="0.6" fill="none" opacity="0.5"/>
      <path d="M 40 0 L 40 28 L 32 36 L 32 44 L 40 52 L 40 80" stroke="#7A5410" stroke-width="0.6" fill="none" opacity="0.5"/>
      <circle cx="40" cy="40" r="1.6" fill="#F5C24A" opacity="0.55"/>
    </pattern>
    <filter id="hgh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#hgh-bg)"/>
  <rect width="1200" height="600" fill="url(#hgh-circuit)" opacity="0.55"/>
  <rect width="1200" height="600" fill="url(#hgh-spot)"/>

  <!-- lightning strokes -->
  <g stroke="url(#hgh-gold)" stroke-width="1.8" fill="none" opacity="0.6">
    <path d="M 80 80 L 130 130 L 110 160 L 170 210"/>
    <path d="M 1120 70 L 1070 120 L 1100 150 L 1050 200"/>
    <path d="M 60 470 L 110 500 L 90 530 L 150 560"/>
    <path d="M 1140 470 L 1090 510 L 1110 540 L 1060 570"/>
  </g>

  <!-- left brief card mock -->
  <g transform="translate(60, 200)" opacity="0.92">
    <rect x="0" y="0" width="260" height="220" rx="14" fill="#100904" stroke="url(#hgh-gold)" stroke-width="1.4"/>
    <rect x="14" y="14" width="92" height="6" rx="3" fill="#F5C24A"/>
    <rect x="14" y="28" width="140" height="4" rx="2" fill="#6E4E15"/>
    <circle cx="68" cy="120" r="38" fill="none" stroke="#F5C24A" stroke-width="6" stroke-dasharray="140 80"/>
    <text x="68" y="125" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFE07A" text-anchor="middle">94%</text>
    <rect x="130" y="84" width="116" height="22" rx="5" fill="#1A0E03" stroke="#F5C24A" stroke-width="0.8"/>
    <rect x="130" y="116" width="116" height="22" rx="5" fill="#1A0E03" stroke="#F5C24A" stroke-width="0.8" opacity="0.6"/>
    <rect x="130" y="148" width="78" height="22" rx="5" fill="#F5C24A"/>
  </g>

  <!-- right tagline -->
  <g transform="translate(720, 110)" opacity="0.96">
    <rect x="0" y="0" width="440" height="140" rx="14" fill="#0A0703" stroke="url(#hgh-gold)" stroke-width="1.6"/>
    <text x="24" y="58" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#FFEAD0">Your business.</text>
    <text x="24" y="106" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#F5C24A">Automated.</text>
  </g>

  <!-- right code card -->
  <g transform="translate(780, 290)" opacity="0.9">
    <rect x="0" y="0" width="360" height="200" rx="12" fill="#070401" stroke="url(#hgh-gold)" stroke-width="1"/>
    <g font-family="JetBrains Mono, monospace" font-size="11" fill="#FFE07A">
      <text x="14" y="28">hermes.run({</text>
      <text x="28" y="48">brief: "Q3 sales recap",</text>
      <text x="28" y="68">format: "executive",</text>
      <text x="28" y="88">audience: "board"</text>
      <text x="14" y="108">})</text>
      <text x="14" y="138" fill="#F5C24A">→ generated 4 deliverables</text>
      <text x="14" y="158" fill="#F5C24A">→ saved to /reports/q3-2026</text>
      <text x="14" y="178" fill="#FFEAA0">→ ready for review ✓</text>
    </g>
  </g>

  <!-- centerpiece golden Hermes emblem (helm + caduceus) -->
  <g transform="translate(600, 320)" filter="url(#hgh-glow)">
    <!-- backdrop disc -->
    <circle r="120" fill="#0A0703" stroke="url(#hgh-gold)" stroke-width="2.4" opacity="0.95"/>
    <circle r="104" fill="none" stroke="url(#hgh-gold)" stroke-width="0.8" opacity="0.6"/>

    <!-- caduceus -->
    <g stroke="url(#hgh-gold)" stroke-linecap="round" fill="none">
      <line x1="0" y1="-60" x2="0" y2="80" stroke-width="6"/>
      <path d="M 0 -40 C -28 -22, -28 0, 0 14 C 28 28, 28 50, 0 64" stroke-width="4.6"/>
      <path d="M 0 -40 C 28 -22, 28 0, 0 14 C -28 28, -28 50, 0 64" stroke-width="4.6"/>
      <!-- wings -->
      <path d="M -40 -68 Q -10 -86, 0 -56" stroke-width="4"/>
      <path d="M 40 -68 Q 10 -86, 0 -56" stroke-width="4"/>
      <path d="M -56 -56 Q -20 -76, -6 -50" stroke-width="2.6" opacity="0.8"/>
      <path d="M 56 -56 Q 20 -76, 6 -50" stroke-width="2.6" opacity="0.8"/>
      <circle cx="0" cy="-62" r="4.5" fill="url(#hgh-gold)" stroke="none"/>
    </g>

    <!-- winged helm above disc -->
    <g transform="translate(0, -132)">
      <path d="M -50 22 Q -60 -10, -36 -26 Q -12 -38, 12 -36 Q 42 -34, 52 -10 Q 56 14, 42 26 L -42 26 Z"
            fill="url(#hgh-gold)" stroke="#7A5410" stroke-width="1.4"/>
      <path d="M -50 -2 Q -92 -14, -100 -38 Q -72 -34, -56 -22 Q -62 -10, -52 0 Z"
            fill="url(#hgh-gold)" opacity="0.85" stroke="#7A5410" stroke-width="1"/>
      <path d="M 50 -2 Q 92 -14, 100 -38 Q 72 -34, 56 -22 Q 62 -10, 52 0 Z"
            fill="url(#hgh-gold)" opacity="0.85" stroke="#7A5410" stroke-width="1"/>
    </g>
  </g>

  <!-- bottom label -->
  <g transform="translate(600, 562)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#F5C24A" text-anchor="middle">AI EVOLUTION LABS · HERMES</text>
  </g>
</svg>
